# HTTP（80）：无证书时的访问入口；有域名后建议改用 HTTPS 并把 80 重定向过去
upstream pda_web {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 前端会上传参考图、下载 .epro / STEP，默认 1m 不够
    client_max_body_size 50m;

    # ---------- 所有请求都打到 Next.js（worker 由前端 /api/agent/* 服务端代理转发）----------
    location / {
        proxy_pass http://pda_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / 流式升级（Next 的 HMR 与 RSC 流式渲染要用）
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # ---------- SSE 生命线 ----------
        # 智能体一次运行几十分钟，事件流是一条长期不关闭的 HTTP 连接。
        # 开了 buffering / gzip，nginx 会攒够一个包再发，打字机效果变成「憋 30 秒吐一大段」。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        # 比单次运行的硬上限再宽一点（AGENT_MAX_SECONDS 默认 900s）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

# $connection_upgrade 需要写在 http 块里，见 nginx/conf.d/00-upgrade-map.conf
