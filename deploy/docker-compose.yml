# 一键编排：worker(:8001) + web(:3000) + nginx(:80/:443)
# 用法见 deploy/README.md；所有命令在仓库根目录执行：
#   docker compose -f deploy/docker-compose.yml up -d
services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    image: pda-worker:latest
    container_name: pda-worker
    restart: unless-stopped
    # .env 是本项目唯一权威配置（config.py 用 override=True 加载），密钥只写这里
    env_file:
      - ../.env
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8001"
      # 强烈建议用 E2B 云端建模：本机装 OCP 要 700MB+，小内存 ECS 并发建模必 OOM
      AGENT_CAD_RUNTIME: ${AGENT_CAD_RUNTIME:-auto}
      AGENT_MOCK: "0"
    volumes:
      # sqlite 索引（会话/事件/产物清单）：唯一需要备份的核心数据
      - ../data:/app/data
      # 每次运行的产物目录（STEP/STL/PCB/渲染图…）：体积大，按需清理
      - ../workspace:/app/workspace
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # 单进程：store 用 sqlite 且连接是模块级单例，多副本会互相抢库
    deploy:
      resources:
        limits:
          memory: 2G

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: pda-web:latest
    container_name: pda-web
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    environment:
      # 前端 /api/agent/* 是服务端代理，走 compose 内网访问 worker
      AGENT_WORKER_URL: http://worker:8001
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  nginx:
    image: nginx:1.27-alpine
    container_name: pda-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      # 申请到证书后再放开 443，并把 deploy/nginx/agent-ssl.conf.example 复制为 agent-ssl.conf
      # - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
